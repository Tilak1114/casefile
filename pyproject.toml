[project]
name = "casefile"
version = "0.1.0"
description = "Agent harness that reconstructs a construction project's record into a cited chronology and party map"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "pydantic>=2.8",
    "pymongo>=4.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
casefile = "casefile.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local MongoDB container or network"]
addopts = "-m 'not integration'"
