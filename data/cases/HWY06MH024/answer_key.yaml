# Answer key for docket HWY06MH024 (I-90 connector tunnel ceiling collapse, Boston, 10 July 2006).
# STATUS: DRAFT for review. Built from NTSB HAR-07/02 and the 35 project-record files the agent may read
# (case.json group "project_record").
#
# evidence.page  = 1-based page within the docket PDF; quotes match the page text (pdftotext text layer,
#                  or Reducto r-1 OCR for scanned pages) after whitespace collapsing.
# ntsb.page      = printed page number of HAR-07/02 (PDF page index minus 12 for the body pages).
# NTSB cover sheets and separator pages (page 1 of each attachment, file 19 pp.1-2, file 93 separator
# pages) are NTSB labels, not project records, and are never cited.
#
# Split method: random.Random(26); events stratified by core (core ids sorted, shuffled, first
# round(0.3*n) -> heldout; then non-core the same way), then negatives, then relationships, each
# sorted, shuffled with the same generator and the first round(0.3*n) held out. Parties carry no split.
