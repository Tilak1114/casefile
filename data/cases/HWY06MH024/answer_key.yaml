# Answer key for docket HWY06MH024 (I-90 connector tunnel ceiling collapse, Boston, 10 July 2006).
# STATUS: DRAFT for review. Built from NTSB HAR-07/02 and the 88 docket files the agent may read
# (case.json group "input"). The 6 withheld files (17, 24, 25, 82, 91, 92) are NTSB-authored analysis
# and are never cited as evidence.
#
# evidence.page  = 1-based page within the docket PDF; quotes match the stored page text (pdftotext text
#                  layer, or Reducto OCR for scanned pages) after whitespace collapsing.
# ntsb.page      = printed page number of HAR-07/02 (PDF page index minus 12 for the body pages).
# Pages stored with is_label true (NTSB cover sheets and separator pages) are not project records and are
# never cited.
#
# Split method: random.Random(26); events stratified by core (core ids sorted, shuffled, first
# round(0.3*n) -> heldout; then non-core the same way), then negatives, then relationships, each
# sorted, shuffled with the same generator and the first round(0.3*n) held out. Parties carry no split.
# 88-file revision: existing items keep their splits. The items added in this revision (E42-E49, N07)
# were split by the same method run on the new ids only (a fresh random.Random(26); new core events
# E42-E49 -> heldout E44, E48; no new non-core events; new negatives N07 -> dev; no new relationships).
# Events after the collapse (E45-E49) are included only where HAR-07/02 relies on them for the causal
# chain.
# Evidence audit (2026-09-26): for every event, the 88 input files were searched for other pages that
# document the same occurrence (copies in file 93, cover letters, return transmittals, daily-report forms),
# independently of any agent run; pages added only with a quote that matches exactly, and each event now
# cites a page showing its date. Dates and splits are unchanged.
